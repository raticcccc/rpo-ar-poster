<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ready Player One – AR Poster</title>
<script src="vendor/aframe-v1.5.0.min.js"></script>
<script src="vendor/mindar-image-aframe.prod.js"></script>
<style>
  :root{--pink:#ff2d95;--cyan:#27e1ff;--ink:#0b0720;--glass:rgba(14,8,40,.82)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}
  a-scene{position:fixed;inset:0}
  .hidden{display:none!important}

  /* Start screen */
  #start{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;
    background:radial-gradient(ellipse at 50% 20%,#3b1273 0%,#150a38 55%,#07041a 100%)}
  #start h1{margin:0;font-size:clamp(34px,9vw,56px);line-height:1;letter-spacing:.04em;text-transform:uppercase;
    color:#fff;text-shadow:0 0 12px var(--pink),0 0 28px var(--pink),0 0 48px #7b2cff}
  #start p{margin:0;max-width:34ch;opacity:.85;line-height:1.5}
  .btn{appearance:none;border:2px solid var(--cyan);background:transparent;color:var(--cyan);font:700 16px/1 inherit;letter-spacing:.12em;text-transform:uppercase;
    padding:16px 30px;border-radius:999px;box-shadow:0 0 18px rgba(39,225,255,.45),inset 0 0 14px rgba(39,225,255,.2);cursor:pointer}
  .btn:active{transform:scale(.97)}
  #start small{opacity:.55;max-width:36ch;line-height:1.4}

  /* Scanning hint */
  #scan{position:fixed;inset:0;z-index:20;pointer-events:none;display:flex;align-items:flex-end;justify-content:center;padding-bottom:12vh}
  #scan .box{position:absolute;top:18%;bottom:26%;left:12%;right:12%;border:2px dashed rgba(39,225,255,.8);border-radius:14px;box-shadow:0 0 24px rgba(39,225,255,.35)}
  #scan .msg{position:relative;background:var(--glass);border:1px solid rgba(255,255,255,.18);padding:10px 16px;border-radius:999px;font-size:14px}

  /* HUD */
  #hud{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:max(12px,env(safe-area-inset-top)) 14px 10px;pointer-events:none}
  #hud>*{pointer-events:auto}
  .chip{background:var(--glass);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:8px 14px;font-size:13px;letter-spacing:.05em;display:flex;gap:8px;align-items:center}
  .chip b{color:var(--cyan)}
  #mute{width:42px;height:38px;justify-content:center;padding:0;cursor:pointer;font-size:17px}

  /* Info panel */
  #panel{position:fixed;left:0;right:0;bottom:0;z-index:40;transform:translateY(105%);transition:transform .28s ease;padding:0 12px max(14px,env(safe-area-inset-bottom))}
  #panel.open{transform:none}
  #panel .card{max-width:560px;margin:0 auto;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid var(--pink);border-radius:18px;padding:16px 18px 18px;box-shadow:0 0 24px rgba(255,45,149,.35)}
  #panel .tag{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan)}
  #panel h2{margin:4px 0 8px;font-size:21px}
  #panel p{margin:0;line-height:1.5;font-size:15px;opacity:.92}
  #panel .close{position:absolute;right:26px;top:10px;background:none;border:0;color:#fff;font-size:26px;line-height:1;padding:6px;cursor:pointer}

  /* Toast */
  #toast{position:fixed;left:50%;top:70px;transform:translate(-50%,-20px);opacity:0;z-index:45;background:linear-gradient(90deg,var(--pink),#7b2cff);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;transition:.3s;pointer-events:none;white-space:nowrap}
  #toast.show{opacity:1;transform:translate(-50%,0)}

  /* Hide MindAR built-in overlays we replaced */
  .mindar-ui-overlay.mindar-ui-scanning,.mindar-ui-overlay.mindar-ui-loading{display:none!important}
</style>
</head>
<body>

<div id="start">
  <h1>Ready<br>Player<br>One</h1>
  <p>Point your camera at the poster to unlock the OASIS. Find both keys, then crack open the Egg.</p>
  <button id="startBtn" class="btn">Enter the OASIS</button>
  <small>Camera access is needed to track the poster. Sound on for the full experience.</small>
</div>

<div id="scan" class="hidden"><div class="box"></div><div class="msg">Aim at the full poster and hold steady</div></div>

<div id="hud" class="hidden">
  <div class="chip">🔑 Keys <b id="keyCount">0 / 2</b></div>
  <div id="mute" class="chip" title="Sound on/off" role="button" aria-label="Toggle sound">🔊</div>
</div>

<div id="toast"></div>

<div id="panel" aria-live="polite">
  <div class="card">
    <button class="close" id="closePanel" aria-label="Close">×</button>
    <div class="tag" id="pTag"></div>
    <h2 id="pTitle"></h2>
    <p id="pBody"></p>
  </div>
</div>

<audio id="bgm" src="assets/loop.mp3" loop preload="auto" playsinline></audio>

<a-scene
  mindar-image="imageTargetSrc: assets/poster.mind; autoStart: false; maxTrack: 1; uiLoading: no; uiScanning: no; uiError: yes; filterMinCF: 0.0005; filterBeta: 200; warmupTolerance: 4; missTolerance: 8;"
  color-space="sRGB" renderer="colorManagement: true; physicallyCorrectLights: false; antialias: true; alpha: true"
  vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <!-- Poster is 1 unit wide; height = 1145/741 ≈ 1.545. Origin is the poster centre. -->
  <a-entity id="target" mindar-image-target="targetIndex: 0">
    <a-entity light="type: ambient; color: #ffffff; intensity: 0.9"></a-entity>
    <a-entity light="type: directional; color: #ffd6f0; intensity: 1.1" position="0.5 1 1"></a-entity>
    <a-entity id="scene-root"></a-entity>
  </a-entity>
</a-scene>

<script>
(function () {
  // ---------- Poster geometry ----------
  const IMG_W = 741, IMG_H = 1145;           // pixel size of assets/poster.jpg
  const ASPECT = IMG_H / IMG_W;
  const toX = px => px / IMG_W - 0.5;
  const toY = py => (0.5 - py / IMG_H) * ASPECT;

  // ---------- Content: edit these ----------
  // px,py = pixel position on poster.jpg where the hotspot sits.
  const HOTSPOTS = [
    { id:'jade',   px:93,  py:262, kind:'key',  color:'#2fe36b', tag:'Collectible',
      title:'The Jade Key',
      body:'The poster shows the Jade Key hovering at top left. In the story, the OASIS hides three keys (Copper, Jade and Crystal), and each one is won by solving a challenge set by the creator, James Halliday.' },
    { id:'copper', px:633, py:262, kind:'key',  color:'#ff9d3c', tag:'Collectible',
      title:'The Copper Key',
      body:'The Copper Key is the first key in the hunt, and it is won by beating an impossible race. Nobody had cracked it for five years until Parzival tried something different.' },
    { id:'egg',    px:373, py:72,  kind:'egg',  color:'#ffd23c', tag:'The Prize',
      title:'Halliday’s Easter Egg',
      body:'Collect all three keys, pass the three gates, and you win the Egg: full control of the OASIS and a fortune. Whoever finds it inherits Halliday’s company.' },
    { id:'face',   px:363, py:372, kind:'info', color:'#27e1ff', tag:'Character',
      title:'Parzival',
      body:'Parzival is the OASIS avatar of Wade Watts (played by Tye Sheridan), a teenager in 2045 who escapes a bleak real world by hunting Halliday’s Easter Egg inside the virtual universe.' },
    { id:'giant',  px:613, py:708, kind:'info', color:'#27e1ff', tag:'Pop-culture cameo',
      title:'The Giant Robot',
      body:'The towering robot on the right is The Iron Giant, a character from the 1999 animated film. The movie is packed with cameos from games, films and music, and the poster hints at a few of them.' },
    { id:'imax',   px:363, py:1052, kind:'info', color:'#27e1ff', tag:'Release',
      title:'March 29 · IMAX',
      body:'Directed by Steven Spielberg from Ernest Cline’s novel, with music by Alan Silvestri. The poster promotes the March 29, 2018 release, advertising it as bigger in IMAX.' }
  ];

  // ---------- State ----------
  const found = new Set();
  let eggUnlocked = false, muted = false, started = false;
  const $ = id => document.getElementById(id);
  const root = () => $('scene-root');

  // ---------- Tiny WebAudio sfx ----------
  let ac;
  function tone(freqs, dur = 0.12, gap = 0.09, type = 'square', vol = 0.06) {
    if (muted) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      freqs.forEach((f, i) => {
        const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i * gap;
        o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
      });
    } catch (e) {}
  }
  const blip = () => tone([880, 1320], 0.08, 0.06);
  const fanfare = () => tone([523, 659, 784, 1047, 1319], 0.22, 0.11, 'triangle', 0.09);

  // ---------- Build the AR content ----------
  const ce = (tag, attrs = {}, parent) => {
    const el = document.createElement(tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(el);
    return el;
  };

  function lowPolyKey(color, parent) {
    const g = ce('a-entity', { rotation: '0 0 0' }, parent);
    ce('a-torus', { radius: .035, 'radius-tubular': .011, 'segments-radial': 5, 'segments-tubular': 7,
      color, material: 'flatShading: true; metalness: .5; roughness: .4', position: '0 .075 0' }, g);
    ce('a-cylinder', { radius: .011, height: .15, 'segments-radial': 5, color,
      material: 'flatShading: true; metalness: .5; roughness: .4', position: '0 -.015 0' }, g);
    ce('a-box', { width: .04, height: .014, depth: .014, color, material: 'flatShading: true', position: '.022 -.06 0' }, g);
    ce('a-box', { width: .028, height: .014, depth: .014, color, material: 'flatShading: true', position: '.016 -.036 0' }, g);
    return g;
  }

  function lowPolyEgg(parent) {
    const g = ce('a-entity', {}, parent);
    const egg = ce('a-sphere', { radius: .055, 'segments-width': 8, 'segments-height': 6, scale: '1 1.3 1',
      material: 'flatShading: true; color: #6b6b7a; emissive: #000; metalness: .6; roughness: .35' }, g);
    egg.id = 'eggMesh';
    ce('a-sphere', { radius: .06, 'segments-width': 8, 'segments-height': 6, scale: '1 1.3 1',
      material: 'wireframe: true; color: #ffd23c; opacity: .55; transparent: true' }, g);
    return g;
  }

  function build() {
    const r = root();

    // Living canvas: a neon scan-line sweeping over the poster (additive glow)
    const bar = ce('a-plane', { width: 1, height: .035, position: `0 ${-ASPECT/2} .004`,
      material: 'shader: flat; color: #27e1ff; opacity: .28; transparent: true; blending: additive; depthWrite: false' }, r);
    bar.setAttribute('animation', `property: position; from: 0 ${-ASPECT/2} .004; to: 0 ${ASPECT/2} .004; dur: 5200; easing: linear; loop: true`);

    // Soft pulsing glow halo behind the egg position
    const egg = HOTSPOTS.find(h => h.kind === 'egg');
    const halo = ce('a-circle', { radius: .16, position: `${toX(egg.px)} ${toY(egg.py)} .01`,
      material: 'shader: flat; color: #ffd23c; opacity: .0; transparent: true; blending: additive; depthWrite: false' }, r);
    halo.id = 'eggHalo';

    HOTSPOTS.forEach(h => {
      const x = toX(h.px), y = toY(h.py);
      const slot = ce('a-entity', { position: `${x} ${y} 0`, id: 'slot-' + h.id }, r);

      // 3D pop-out, floating above the poster surface
      const floatY = h.kind === 'key' ? .13 : .12;
      const pop = ce('a-entity', { position: `0 0 ${floatY}` }, slot);
      if (h.kind === 'key') {
        const k = lowPolyKey(h.color, pop);
        k.setAttribute('animation__spin', 'property: rotation; to: 0 360 0; dur: 5000; easing: linear; loop: true');
        pop.setAttribute('animation__bob', `property: position; from: 0 0 ${floatY}; to: 0 .012 ${floatY + .03}; dir: alternate; dur: 1400; easing: easeInOutSine; loop: true`);
      } else if (h.kind === 'egg') {
        const e = lowPolyEgg(pop);
        e.setAttribute('animation__spin', 'property: rotation; to: 0 360 0; dur: 9000; easing: linear; loop: true');
        pop.setAttribute('animation__bob', `property: position; from: 0 0 ${floatY}; to: 0 .015 ${floatY + .03}; dir: alternate; dur: 1800; easing: easeInOutSine; loop: true`);
      }

      // Hotspot ring (visual) + larger invisible hit target (easy to tap)
      const ring = ce('a-ring', { 'radius-inner': .045, 'radius-outer': .056, 'segments-theta': 24, position: '0 0 .02',
        material: `shader: flat; color: ${h.kind === 'egg' ? '#8a8a99' : h.color}; opacity: .95; transparent: true; side: double` }, slot);
      ring.id = 'ring-' + h.id;
      ring.setAttribute('animation', 'property: scale; from: 1 1 1; to: 1.3 1.3 1.3; dir: alternate; dur: 900; easing: easeInOutSine; loop: true');
      ce('a-circle', { radius: .045, position: '0 0 .018',
        material: `shader: flat; color: ${h.color}; opacity: .22; transparent: true; side: double` }, slot);

      const hit = ce('a-circle', { radius: .11, position: '0 0 .03', class: 'clickable',
        material: 'shader: flat; opacity: 0; transparent: true; side: double; depthWrite: false' }, slot);
      hit.hotspot = h;
    });
  }

  // ---------- Interaction ----------
  function showPanel(tag, title, body) {
    $('pTag').textContent = tag; $('pTitle').textContent = title; $('pBody').textContent = body;
    $('panel').classList.add('open');
  }
  $('closePanel').onclick = () => $('panel').classList.remove('open');

  let toastT;
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600);
  }

  function onTap(h) {
    blip();
    if (h.kind === 'egg' && !eggUnlocked) {
      showPanel('Locked', 'The Egg is sealed', 'Find and collect both keys on the poster first. Tap the glowing rings.');
      return;
    }
    showPanel(h.tag, h.title, h.body);
    if (h.kind === 'key' && !found.has(h.id)) {
      found.add(h.id);
      $('keyCount').textContent = found.size + ' / 2';
      const ring = $('ring-' + h.id); ring.setAttribute('material', 'color', '#ffffff');
      if (found.size === 2) unlockEgg(); else toast('Key collected!');
    }
  }

  function unlockEgg() {
    eggUnlocked = true;
    setTimeout(() => {
      fanfare(); toast('Both keys found. The Egg is unlocked!');
      const mesh = $('eggMesh');
      mesh.setAttribute('material', 'color', '#ffd23c');
      mesh.setAttribute('material', 'emissive', '#ffb300');
      mesh.setAttribute('material', 'emissiveIntensity', 0.9);
      $('ring-egg').setAttribute('material', 'color', '#ffd23c');
      const halo = $('eggHalo');
      halo.setAttribute('animation', 'property: material.opacity; from: .05; to: .5; dir: alternate; dur: 900; easing: easeInOutSine; loop: true');
      burst($('slot-egg'));
    }, 600);
  }

  function burst(parent) {
    for (let i = 0; i < 28; i++) {
      const a = Math.random() * Math.PI * 2, d = .12 + Math.random() * .2, z = .12 + Math.random() * .15;
      const p = ce('a-tetrahedron', { radius: .008 + Math.random() * .008, position: `0 0 .12`,
        material: `shader: flat; color: ${i % 2 ? '#ffd23c' : '#ff2d95'}` }, parent);
      p.setAttribute('animation__m', `property: position; to: ${Math.cos(a) * d} ${Math.sin(a) * d} ${z}; dur: 900; easing: easeOutQuad`);
      p.setAttribute('animation__s', 'property: scale; from: 1 1 1; to: 0 0 0; delay: 500; dur: 600');
      setTimeout(() => p.remove(), 1300);
    }
  }

  // ---------- App flow ----------
  const sceneEl = document.querySelector('a-scene');
  const bgm = $('bgm');

  function setMuted(m) {
    muted = m; bgm.muted = m; $('mute').textContent = m ? '🔇' : '🔊';
  }
  $('mute').onclick = () => setMuted(!muted);

  $('startBtn').onclick = async () => {
    // user gesture: unlock audio on iOS/Android, then start the camera + tracker
    try { await bgm.play(); bgm.pause(); } catch (e) {}
    try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch (e) {}
    $('start').classList.add('hidden');
    $('hud').classList.remove('hidden');
    $('scan').classList.remove('hidden');
    const sys = sceneEl.systems['mindar-image-system'];
    started = true;
    try { await sys.start(); } catch (e) {
      $('start').classList.remove('hidden'); $('hud').classList.add('hidden'); $('scan').classList.add('hidden');
      $('start').querySelector('p').textContent = 'Could not start the camera. Allow camera access and make sure the page is opened over HTTPS.';
    }
  };

  // Tap handling: raycast from the tap point into the hotspot hit-discs.
  // (More reliable on phones than A-Frame's built-in cursor.)
  let tracking = false;
  const ray = new AFRAME.THREE.Raycaster();
  function onPointerUp(e) {
    if (!tracking) return;
    const canvas = sceneEl.canvas, r = canvas.getBoundingClientRect();
    const ndc = new AFRAME.THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, sceneEl.camera);
    const objs = Array.from(document.querySelectorAll('.clickable')).map(el => el.object3D);
    const hit = ray.intersectObjects(objs, true)[0];
    const el = hit && hit.object.el;
    if (el && el.hotspot) onTap(el.hotspot);
  }

  function boot() {
    build();
    sceneEl.canvas.addEventListener('pointerup', onPointerUp);
    const tgt = $('target');
    tgt.addEventListener('targetFound', () => {
      tracking = true;
      $('scan').classList.add('hidden');
      bgm.play().catch(() => {});
    });
    tgt.addEventListener('targetLost', () => {
      tracking = false;
      $('scan').classList.remove('hidden');
      bgm.pause();
      $('panel').classList.remove('open');
    });
  }
  if (sceneEl.hasLoaded) boot(); else sceneEl.addEventListener('loaded', boot);

  window.__ar = { onTap, HOTSPOTS };   // handy for testing
})();
</script>
</body>
</html>
